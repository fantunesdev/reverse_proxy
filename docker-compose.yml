services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - proxy-network
      - https-proxy

networks:
  https-proxy:
    external: true
    name: myfinance-proxy
  proxy-network:
    driver: bridge
