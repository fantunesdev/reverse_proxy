map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name myfinance.com 192.168.100.10;
    # Keep the requested supported address; never redirect to an arbitrary Host.
    if ($host !~ ^(myfinance\.com|192\.168\.100\.10)$) { return 444; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name myfinance.com 192.168.100.10;
    ssl_certificate /etc/nginx/certs/myfinance.crt;
    ssl_certificate_key /etc/nginx/certs/myfinance.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host !~ ^(myfinance\.com|192\.168\.100\.10)$) { return 444; }

    location / {
        proxy_pass http://nginx-myfin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite client-supplied protocol headers at the trusted boundary.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name myprod.com;

    location / {
        proxy_pass http://192.168.100.10:82;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
